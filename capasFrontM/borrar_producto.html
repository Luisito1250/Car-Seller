<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h2 class="text-center text-danger">Eliminar Cita</h2>
            <p class="text-center text-muted">Esta acción eliminará la solicitud de cita de la base de datos.</p>

            <form id="borrar-form">
                <div class="mb-3">
                    <label for="id" class="form-label">ID de la Cita</label>
                    <input type="number" id="id" class="form-control" min="1" required placeholder="Ej: 1">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-danger">Eliminar Cita</button>
                                    </div>
            </form>

            <div id="mensaje" class="alert d-none mt-4"></div>

            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
            </div>
        </div>
    </div>
</div>

<script>
// Captura el parámetro ?id= de la URL si se presiona "Borrar" en la tabla de citas
const parametros = new URLSearchParams(window.location.search);
const idURL = parametros.get('id');

if (idURL) {
    document.getElementById('id').value = idURL;
}

document.getElementById('borrar-form').addEventListener('submit', async function(event) {
    event.preventDefault();

    const id = document.getElementById('id').value;
    const mensaje = document.getElementById('mensaje');
    
    const confirmar = confirm(`¿Está seguro de que desea borrar la cita con ID ${id}?`);

    if (!confirmar) {
        return;
    }

    try {
        const respuesta = await fetch(`http://192.168.100.3:3003/api/citas/${id}`, {
            method: 'DELETE'
        });

        // Validar primero si el servidor devolvió un error (HTML de 404/500)
        if (!respuesta.ok) {
            if (respuesta.status === 404) {
                throw new Error(`La cita con ID ${id} no fue encontrada.`);
            }
            throw new Error('No se pudo eliminar la cita en el servidor.');
        }

        const data = await respuesta.json();

        mensaje.className = 'alert alert-success mt-4';
        mensaje.textContent = data.mensaje || 'Cita eliminada correctamente.';

        document.getElementById('borrar-form').reset();
        
    } catch (error) {
        mensaje.className = 'alert alert-danger mt-4';
        mensaje.textContent = 'Error: ' + error.message;
    }
});
</script>

</body>
</html>
