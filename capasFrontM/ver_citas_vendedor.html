<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas - Vendedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Gestión de Citas y Ventas</h2>
            <p class="text-muted mb-0">Administra las solicitudes de prueba de manejo y aprueba ventas.</p>
        </div>
        <a href="/capasFrontR/vendedor.html" class="btn btn-secondary">&larr; Volver al Panel</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID Cita</th>
                            <th>Comprador</th>
                            <th>Vehículo / Placa</th>
                            <th>Fecha y Hora</th>
                            <th>Estado Actual</th>
                            <th class="text-center">Gestión / Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCitas">
                        <!-- Carga dinámica de citas -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const API_CITAS = "http://192.168.100.3:3003/api/citas";

// Validar sesión del vendedor
const usuario = JSON.parse(localStorage.getItem("usuario")) || {};
const idVendedorActual = usuario.id || usuario.id_usuario;

if (!usuario || (usuario.rol && usuario.rol !== 'vendedor')) {
    alert("Acceso denegado. Debe iniciar sesión como vendedor.");
    window.location.href = "/index.html";
}

async function cargarCitas() {
    try {
        const respuesta = await fetch(API_CITAS);
        const citas = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(citas.error || "No se pudieron obtener las citas.");
        }

        const tabla = document.getElementById("tablaCitas");
        tabla.innerHTML = "";

        // Filtrar citas asociadas únicamente a los vehículos del vendedor
        const misCitas = citas.filter(c => {
            const idVendedorCita = c.id_vendedor || (c.vehiculo && c.vehiculo.id_vendedor);
            return !idVendedorCita || String(idVendedorCita) === String(idVendedorActual);
        });

        if (misCitas.length === 0) {
            tabla.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No tienes solicitudes de citas registradas.</td></tr>`;
            return;
        }

        misCitas.forEach(c => {
            // Nombre del Comprador
            const compradorTexto = c.comprador
                ? (c.comprador.nombre || c.comprador.correo || `ID: ${c.id_comprador}`)
                : `ID: ${c.id_comprador}`;

            // Datos del Vehículo
            const placaTexto = c.vehiculo
                ? `${c.vehiculo.marca || ''} ${c.vehiculo.modelo || ''} (${c.vehiculo.placa || 'Sin Placa'})`
                : `ID Vehículo: ${c.id_vehiculo}`;

            // Fecha y Hora
            const fechaFormateada = c.fecha_hora
                ? new Date(c.fecha_hora).toLocaleString()
                : "Sin fecha";

            // Color del badge según estado
            const estado = c.estado_cita || 'Pendiente';
            let badgeColor = 'bg-warning text-dark';
            if (estado === 'Aceptada' || estado === 'Confirmada') badgeColor = 'bg-primary';
            if (estado === 'Venta Aprobada' || estado === 'Completada') badgeColor = 'bg-success';
            if (estado === 'Rechazada' || estado === 'Cancelada') badgeColor = 'bg-danger';

            tabla.innerHTML += `
                <tr>
                    <td><strong>#${c.id_cita}</strong></td>
                    <td>${compradorTexto}</td>
                    <td><span class="badge bg-dark">${placaTexto}</span></td>
                    <td>${fechaFormateada}</td>
                    <td><span class="badge ${badgeColor}">${estado}</span></td>
                    <td class="text-center">
                        <div class="btn-group btn-group-sm" role="group">
                            <button class="btn btn-outline-success" onclick="cambiarEstadoCita(${c.id_cita}, 'Aceptada')">✅ Aceptar</button>
                            <button class="btn btn-success" onclick="cambiarEstadoCita(${c.id_cita}, 'Venta Aprobada')">🤝 Aprobar Venta</button>
                            <button class="btn btn-outline-danger" onclick="cambiarEstadoCita(${c.id_cita}, 'Rechazada')">❌ Rechazar</button>
                            <button class="btn btn-outline-secondary" onclick="eliminarCita(${c.id_cita})">🗑️ Borrar</button>
                        </div>
                    </td>
                </tr>
            `;
        });

    } catch (error) {
        console.error("Error al cargar citas:", error);
        document.getElementById("tablaCitas").innerHTML = `
            <tr><td colspan="6" class="text-center text-danger py-3">${error.message}</td></tr>
        `;
    }
}

// Función para actualizar el estado de la cita (Aceptar, Aprobar Venta, Rechazar)
async function cambiarEstadoCita(idCita, nuevoEstado) {
    if (!confirm(`¿Deseas cambiar el estado de la cita #${idCita} a "${nuevoEstado}"?`)) return;

    try {
        const res = await fetch(`${API_CITAS}/${idCita}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ estado_cita: nuevoEstado })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "No se pudo actualizar la cita");

        alert(`La cita #${idCita} se actualizó a: ${nuevoEstado}`);
        cargarCitas();
    } catch (err) {
        console.error(err);
        alert(`Error: ${err.message}`);
    }
}

// Eliminar Cita
async function eliminarCita(id) {
    if (!confirm(`¿Seguro que deseas eliminar el registro de la cita #${id}?`)) return;
    
    try {
        const res = await fetch(`${API_CITAS}/${id}`, { method: "DELETE" });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "No se pudo eliminar");

        alert("Cita eliminada correctamente.");
        cargarCitas();
    } catch (err) {
        alert(err.message);
    }
}

// Cargar las citas automáticamente
cargarCitas();
</script>

</body>
</html>
