<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">
            <h2 class="text-center">Editar Cita</h2>
            <p class="text-center text-muted">Modifica la información de una solicitud de cita.</p>

            <form id="editar-form">
                <div class="mb-3">
                    <label for="id" class="form-label">ID de la Cita</label>
                    <input type="number" id="id" class="form-control" min="1" required>
                </div>

                <div class="mb-3">
                    <label for="id_comprador" class="form-label">ID Comprador</label>
                                        <input type="number" id="id_comprador" class="form-control" required min="1">
                </div>

                <div class="mb-3">
                    <label for="id_vehiculo" class="form-label">ID Vehículo</label>
                    <input type="number" id="id_vehiculo" class="form-control" required min="1">
                </div>

                <div class="mb-3">
                    <label for="fecha_hora" class="form-label">Fecha y Hora</label>
                    <input type="datetime-local" id="fecha_hora" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="estado_cita" class="form-label">Estado de la Cita</label>
                    <select id="estado_cita" class="form-select">
                        <option value="Pendiente">Pendiente</option>
                        <option value="Confirmada">Confirmada</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-warning">Guardar cambios</button>
                </div>
            </form>
            
            <div id="mensaje" class="alert d-none mt-4"></div>

            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
            </div>
        </div>
    </div>
</div>

<script>
const parametros = new URLSearchParams(window.location.search);
const idURL = parametros.get('id');

// Si viene un ID en la URL (desde la tabla de ver_productos)
if (idURL) {
    document.getElementById('id').value = idURL;
    cargarDatosCita(idURL);
}

// Cargar los datos actuales de la cita en el formulario
async function cargarDatosCita(id) {
    try {
        const respuesta = await fetch(`http://192.168.100.3:300/api/citas/${id}`);
        if (respuesta.ok) {
            const cita = await respuesta.json();
                        document.getElementById('id_comprador').value = cita.id_comprador;
            document.getElementById('id_vehiculo').value = cita.id_vehiculo;

            // Formatear fecha para el input datetime-local (AAAA-MM-DDTHH:MM)
            if (cita.fecha_hora) {
                const fecha = new Date(cita.fecha_hora);
                const isoString = fecha.toISOString().slice(0, 16);
                document.getElementById('fecha_hora').value = isoString;
            }

            if (cita.estado_cita) {
                document.getElementById('estado_cita').value = cita.estado_cita;
            }
        }
    } catch (error) {
        console.error("Error al cargar datos de la cita:", error);
    }
}

document.getElementById('editar-form').addEventListener('submit', async function(event) {
    event.preventDefault();

    const id = document.getElementById('id').value;
    const id_comprador = document.getElementById('id_comprador').value;
    const id_vehiculo = document.getElementById('id_vehiculo').value;
    const fechaInput = document.getElementById('fecha_hora').value;
    const estado_cita = document.getElementById('estado_cita').value;
    const mensaje = document.getElementById('mensaje');

    // Dar formato AAAA-MM-DD HH:MM:SS a la fecha capturada
    const fechaFormateada = fechaInput.replace('T', ' ') + ':00';

    try {
        const respuesta = await fetch(`http://192.168.100.3:3003/api/citas/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                id_comprador,
                id_vehiculo,
                fecha_hora: fechaFormateada,
                estado_cita
            })
        });

        const data = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(data.error || 'No se pudo actualizar la cita');
        }

        mensaje.className = 'alert alert-success mt-4';
        mensaje.textContent = data.mensaje || 'Cita actualizada correctamente.';

    } catch (error) {
        mensaje.className = 'alert alert-danger mt-4';
        mensaje.textContent = 'Error: ' + error.message;
    }
});
</script>
</body>
</html>
