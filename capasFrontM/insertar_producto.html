<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Solicitud de Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="card shadow-sm p-4" style="max-width: 500px; width: 100%;">
    <div class="card-body">
        <h3 class="card-title text-center text-primary mb-3">Nueva Solicitud de Cita</h3>
        <p class="text-center text-muted small mb-4">Registra una nueva cita ingresando la placa del vehículo.</p>

        <!-- FORMULARIO DE CITA -->
        <form id="formCita">
            <div class="mb-3">
                <label class="form-label fw-bold">Usuario</label>
                <input type="text" id="usuario_nombre" class="form-control" placeholder="Nombre o correo del usuario" r>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Placa del Vehículo</label>
                <input type="text" id="placa" class="form-control text-uppercase" placeholder="Ej: ABC123" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Fecha y Hora de la Cita</label>
                <input type="datetime-local" id="fecha_hora" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100 mb-3">Guardar cita</button>
        </form>

        <div id="mensaje" class="alert d-none mt-3" role="alert"></div>

        <!-- BOTÓN VOLVER AL INICIO QUE REDIRIGE A CapasFrontC -->
        <div class="text-center mt-2">
            <a href="../capasFrontR/cliente.html" class="btn btn-secondary">Volver al inicio</a>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // 1. Cargar usuario logueado desde localStorage si existe
    const usuarioSesion = JSON.parse(localStorage.getItem('usuario'));
    const inputUsuario = document.getElementById('usuario_nombre') || document.getElementById('usuario');

    if (inputUsuario && usuarioSesion) {
        inputUsuario.value = usuarioSesion.nombre || usuarioSesion.correo || usuarioSesion.usuario || '';
            }

    // 2. Obtener el formulario asegurando que existe en el DOM
    const formulario = document.getElementById('formCita');

    if (!formulario) {
        console.error("No se encontró el formulario con id='formCita'");
        return;
    }

    formulario.addEventListener('submit', async function(e) {
        e.preventDefault();

        const msg = document.getElementById('mensaje');
        if (msg) msg.classList.add('d-none');

        // Obtener valores de los inputs
        const elUsuario = document.getElementById('usuario_nombre') || document.getElementById('usuario');
        const usuarioNombre = elUsuario ? elUsuario.value.trim() : '';
        const correoUsuario = usuarioSesion ? (usuarioSesion.correo || usuarioSesion.nombre || usuarioSesion.usuario) : usuarioNombre;
        
        const elPlaca = document.getElementById('placa');
        const elFecha = document.getElementById('fecha_hora');

        if (!elPlaca || !elFecha) {
            alert("Faltan campos obligatorios en el formulario.");
            return;
        }

        const placa = elPlaca.value.trim().toUpperCase();
        const fechaInput = elFecha.value;

        const elEstado = document.getElementById('estado_cita');
        const estado_cita = elEstado ? elEstado.value : 'Pendiente';

        if (!correoUsuario || !placa || !fechaInput) {
            alert("Por favor ingrese el usuario, la placa y la fecha de la cita.");
            return;
        }

        // Formatear la fecha para MySQL (YYYY-MM-DD HH:MM:SS)
        const fechaFormateada = fechaInput.replace('T', ' ') + (fechaInput.length === 16 ? ':00' : '');

        try {
            const respuesta = await fetch('http://192.168.100.3:3003/api/citas', {
                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    correo: correoUsuario,
                    usuario: correoUsuario,
                    placa: placa,
                    fecha_hora: fechaFormateada,
                    estado_cita: estado_cita
                })
            });

            const datos = await respuesta.json();

            if (respuesta.ok) {
                alert('¡Cita agendada con éxito!');
                // REDIRECCIÓN A LA PÁGINA DE INICIO DE CapasFrontC
                window.location.href = '../capasFrontR/cliente.html';
            } else {
                const errorTxt = datos.error || 'No se pudo agendar la cita.';
                if (msg) {
                    msg.className = 'alert alert-danger mt-3';
                    msg.textContent = errorTxt;
                    msg.classList.remove('d-none');
                } else {
                    alert(errorTxt);
                }
            }
                    } catch (err) {
            console.error('Error al agendar la cita:', err);
            if (msg) {
                msg.className = 'alert alert-danger mt-3';
                msg.textContent = 'Error de conexión con el servidor.';
                msg.classList.remove('d-none');
            } else {
                alert('Error de conexión con el servidor.');
            }
        }
    });
});
</script>
</body>
</html>
