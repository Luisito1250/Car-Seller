<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ver Transacciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
    <h2 class="text-center mb-4">Lista de Transacciones</h2>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID Venta</th>
            <th>Monto Total</th>
            <th>Método de Pago</th>
            <th>Fecha de Venta</th>
        </tr>
        </thead>
        <tbody id="transacciones-table-body"></tbody>
    </table>
    <div class="text-center mt-4">
        <a href="index.html" class="btn btn-secondary">Volver</a>
    </div>
    </div>
    
    <script>
    fetch('http://192.168.100.3:3001/api/transacciones')
    .then(response => {
        if (!response.ok) {
            throw new Error('Error en el servidor al consultar la base de datos');
        }
        return response.json();
    })
    .then(data => {
        const tableBody = document.getElementById('transacciones-table-body');

        // Verificar que data realmente sea un arreglo antes de recorrerlo
        if (Array.isArray(data)) {
            data.forEach(transaccion => {
                const row = document.createElement('tr');
                const fechaFormatted = transaccion.fecha_venta
                    ? new Date(transaccion.fecha_venta).toISOString().split('T')[0]
                    : '';

                row.innerHTML = `
                    <td>${transaccion.id_venta}</td>
                    <td>$${Number(transaccion.monto_total).toFixed(2)}</td>
                    <td>${transaccion.metodo_pago}</td>
                    <td>${fechaFormatted}</td>
                `;
                                tableBody.appendChild(row);
            });
        } else {
            console.error('La respuesta no fue una lista:', data);
        }
    })
    .catch(error => {
        console.error('Error al obtener transacciones:', error);
    });
    </script>
</body>
</html>
