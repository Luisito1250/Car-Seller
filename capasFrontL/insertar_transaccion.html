<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Insertar Transacción - Tu Vehículo Usado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 650px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-center mb-4 text-primary">Registrar Nueva Venta / Transacción</h2>

                <form id="transaccion-form">
                    <h5 class="text-secondary mb-3">Relaciones de la Venta</h5>
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="id_vehiculo" class="form-label font-weight-bold">ID Vehículo</label>
                            <input type="number" class="form-control" id="id_vehiculo" placeholder="Ej: 1" min="1" required />
                        </div>
                        <div class="col-md-4">
                            <label for="id_comprador" class="form-label font-weight-bold">ID Comprador</label>
                            <input type="number" class="form-control" id="id_comprador" placeholder="Ej: 1" min="1" required />
                        </div>
                        <div class="col-md-4">
                                                        <label for="id_vendedor" class="form-label font-weight-bold">ID Vendedor</label>
                            <input type="number" class="form-control" id="id_vendedor" placeholder="Ej: 25" min="1" required />
                        </div>
                    </div>

                    <h5 class="text-secondary mb-3">Detalles de Pago</h5>
                    <div class="mb-3">
                        <label for="metodo_pago" class="form-label">Método de pago</label>
                        <select class="form-select" id="metodo_pago" required>
                            <option value="">Seleccione un método</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia">Transferencia Bancaria</option>
                            <option value="Crédito">Crédito / Financiamiento</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="fecha_venta" class="form-label">Fecha de Venta</label>
                        <input type="date" class="form-control" id="fecha_venta" required />
                    </div>

                    <div class="card bg-light mb-3">
                        <div class="card-body">
                            <h6 class="card-title text-primary mb-2">Lista de Chequeo de Documentación</h6>
                            <p class="card-text text-muted small mb-2">Marque todos los puntos para proceder:</p>

                            <div class="form-check mb-1">
                                <input class="form-check-input check-req" type="checkbox" id="check1" required>
                                <label class="form-check-label small" for="check1">
                                    Identidad del comprador y vendedor verificadas.
                                </label>
                            </div>

                            <div class="form-check mb-1">
                                <input class="form-check-input check-req" type="checkbox" id="check2" required>
                                <label class="form-check-label small" for="check2">
                                    Traspaso de propiedad y paz y salvo de impuestos/SOAT al día.
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input check-req" type="checkbox" id="check3" required>
                                <label class="form-check-label small" for="check3">
                                    Conformidad del cliente y contrato firmado.
                                </label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Guardar Transacción</button>
                    <a href="index.html" class="btn btn-secondary w-100 mt-2">Volver al Inicio</a>
                                    </form>

                <div id="mensaje" class="alert mt-4 d-none" role="alert"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('transaccion-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const mensaje = document.getElementById('mensaje');

            const checkboxes = document.querySelectorAll('.check-req');
            const todosValidos = Array.from(checkboxes).every(chk => chk.checked);

            if (!todosValidos) {
                mensaje.className = 'alert alert-danger mt-4';
                mensaje.textContent = 'Debe completar toda la lista de chequeo para continuar.';
                mensaje.classList.remove('d-none');
                return;
            }

            const payload = {
                id_vehiculo: parseInt(document.getElementById('id_vehiculo').value),
                id_comprador: parseInt(document.getElementById('id_comprador').value),
                                id_vendedor: parseInt(document.getElementById('id_vendedor').value),
                metodo_pago: document.getElementById('metodo_pago').value,
                fecha_venta: document.getElementById('fecha_venta').value
            };

            try {
                const response = await fetch('http://192.168.100.3:3001/api/transacciones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al procesar la transacción');
                }

                mensaje.className = 'alert alert-success mt-4';
                mensaje.textContent = data.mensaje || 'Transacción registrada con éxito.';
                mensaje.classList.remove('d-none');
                document.getElementById('transaccion-form').reset();

            } catch (error) {
                mensaje.className = 'alert alert-danger mt-4';
                mensaje.textContent = error.message;
                                mensaje.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
