<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Registrar Usuario</h2>
                <form id="formUsuario">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" id="correo" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select id="rol" class="form-select" required>
                            <option value="cliente">Cliente</option>
                            <option value="vendedor">Vendedor</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Registrarse</button>
                </form>
                <div id="mensaje" class="mt-3 text-center"></div>
                <a href="../index.html" class="btn btn-secondary w-100 mt-3">Volver</a>
            </div>
        </div>
    </div>
    <script>
      document.getElementById('formUsuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value;
        const correo = document.getElementById('correo').value;
        const password = document.getElementById('password').value;
        const rol = document.getElementById('rol').value;

        try {
          const response = await fetch('http://192.168.100.3:3004/api/usuarios/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, correo, password, rol })
          });
          
          const data = await response.json();
          if (response.ok) {
            alert('Usuario creado exitosamente');
            
            // Redirección condicional según el rol seleccionado
            if (rol === 'vendedor') {
              window.location.href = '/vendedor.html'; 
            } else {
              window.location.href = '/index.html';
            }
          } else {
            alert('Error: ' + (data.error || 'No se pudo crear el usuario'));
          }
        } catch (error) {
          console.error('Error al registrar:', error);
          alert('No se pudo conectar con el servidor.');
        }
      });
    </script>
</body>
</html>
