<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Cliente - Tu Vehículo Usado</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-module {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-module:hover {
            transform: translateY(-5px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <!-- Navbar superior con saludo y botón de cerrar sesión -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between align-items-center">
                        <a class="navbar-brand fw-bold" href="#">🏎️ Tu Vehículo Usado</a>
            <div>
                <button onclick="cerrarSesion()" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Encabezado con bienvenida personalizada -->
        <div class="text-center mb-5">
            <h1 class="fw-bold">Bienvenido, <span id="bienvenida" class="text-primary">Cliente</span></h1>
            <p class="text-muted">Selecciona la opción que deseas explorar:</p>
        </div>

        <!-- Fila de Tarjetas (Solo Publicaciones y Citas) -->
        <div class="row g-4 justify-content-center">

            <!-- 1. Módulo Publicaciones -->
            <div class="col-md-5">
                <div class="card card-module h-100 border-primary">
                    <div class="card-body text-center p-4">
                        <div class="fs-1 mb-2">🚗</div>
                        <h4 class="card-title fw-bold text-primary">Publicaciones</h4>
                        <p class="card-text text-muted">Explora el catálogo de anuncios de vehículos disponibles.</p>
                        <a href="/CapasFrontC/index.html" class="btn btn-primary w-100 py-2 fw-semibold">Ver Publicaciones</a>
                    </div>
                                    </div>
            </div>

            <!-- 2. Módulo Citas / Test Drive -->
            <div class="col-md-5">
                <div class="card card-module h-100 border-warning">
                    <div class="card-body text-center p-4">
                        <div class="fs-1 mb-2">📅</div>
                        <h4 class="card-title fw-bold text-warning">Citas / Test Drive</h4>
                        <p class="card-text text-muted">Agenda y gestiona tus citas para probar los vehículos de tu interés.</p>
                        <a href="/capasFrontM/insertar_producto.html" class="btn btn-warning w-100 py-2 fw-semibold text-dark">Agendar cita</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

<script>
    // ==========================================
    // COMPROBACIÓN DE AUTENTICACIÓN Y ROL
    // ==========================================
    const usuario = JSON.parse(localStorage.getItem("usuario"));

    if (!usuario) {
        alert("Debe iniciar sesión para acceder.");
                window.location.href = "/index.html"; // 👈 Agregar '/'
    } else {
        const elBienvenida = document.getElementById("bienvenida");
        if (elBienvenida) {
            elBienvenida.textContent = usuario.nombre || usuario.correo;
        }
    }

    // ==========================================
    // CERRAR SESIÓN
    // ==========================================
    function cerrarSesion() {
        localStorage.removeItem("usuario");
        window.location.href = "/index.html";
    }
</script>

</body>
</html>
