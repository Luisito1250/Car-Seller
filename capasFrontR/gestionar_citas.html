<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Citas Registradas</h2>
        <button class="btn btn-outline-primary" onclick="cargarCitas()">🔄 Actualizar Lista</button>
    </div>

    <div id="mensajeAlert" class="alert d-none" role="alert"></div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Usuario / Comprador</th>
                    <th>Placa Vehículo</th>
                    <th>Fecha y Hora</th>
                                        <th>Estado Actual</th>
                    <th>Cambiar Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaCitas">
                <!-- Las citas se cargan dinámicamente -->
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a href="admin.html" class="btn btn-secondary">Volver al inicio</a>
    </div>
</div>

<!-- MODAL DE EDICIÓN -->
<div class="modal fade" id="modalCita" tabindex="-1" aria-labelledby="modalTitulo">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitulo">Editar Cita</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="formCita">
        <div class="modal-body">
                        <input type="hidden" id="citaId">
            <div class="mb-3">
                <label class="form-label fw-bold">Usuario / Correo</label>
                <input type="text" id="correo" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Placa del Vehículo</label>
                <input type="text" id="placa" class="form-control text-uppercase" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Fecha y Hora</label>
                <input type="datetime-local" id="fecha_hora" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Estado de la Cita</label>
                <select id="estado_cita" class="form-select">
                    <option value="Pendiente">Pendiente</option>
                    <option value="Confirmada">Confirmada</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
              </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// URL del microservicio de Citas (Puerto 3003)
const API_CITAS = 'http://192.168.100.3:3003/api/citas';

let modalBootstrap;

document.addEventListener("DOMContentLoaded", () => {
    // Inicializar el modal de Bootstrap
    const modalEl = document.getElementById("modalCita");
    if (modalEl) {
        modalBootstrap = new bootstrap.Modal(modalEl, { focus: false });
    }

    // Cargar la lista inicial de citas
    cargarCitas();

    // Evento para guardar cambios desde el modal
    const formCita = document.getElementById("formCita");
    if (formCita) {
                formCita.addEventListener("submit", guardarCambiosCita);
    }
});

// 1. CARGAR Y MOSTRAR CITAS
async function cargarCitas() {
    try {
        const respuesta = await fetch(API_CITAS);
        const citas = await respuesta.json();

        if (!respuesta.ok) throw new Error(citas.error || "Error al obtener las citas.");

        const tabla = document.getElementById("tablaCitas");
        if (!tabla) return;

        tabla.innerHTML = "";

        if (citas.length === 0) {
            tabla.innerHTML = `<tr><td colspan="7" class="text-center py-3">No hay citas registradas.</td></tr>`;
            return;
        }

        citas.forEach(c => {
            // Extracción segura del nombre/correo y placa
            const usuarioNombre = (c.comprador && (c.comprador.nombre || c.comprador.correo))
                                  || c.usuario || c.correo || "Sin Usuario";
                                  
            const placaVehiculo = (c.vehiculo && c.vehiculo.placa)
                                  || c.placa || "Sin Placa";

            const fechaTxt = c.fecha_hora ? new Date(c.fecha_hora).toLocaleString() : "N/A";

            let badgeClass = "bg-warning text-dark";
            if (c.estado_cita === "Confirmada") badgeClass = "bg-success";
            if (c.estado_cita === "Cancelada") badgeClass = "bg-danger";

            tabla.innerHTML += `
                <tr>
                    <td><strong>${c.id_cita}</strong></td>
                    <td>${usuarioNombre}</td>
                    <td><span class="badge bg-dark">${placaVehiculo}</span></td>
                    <td>${fechaTxt}</td>
                    <td><span class="badge ${badgeClass}">${c.estado_cita || 'Pendiente'}</span></td>
                    <td>
                        <select class="form-select form-select-sm" onchange="cambiarEstadoDirecto(${c.id_cita}, this.value)">
                            <option value="Pendiente" ${c.estado_cita === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                            <option value="Confirmada" ${c.estado_cita === 'Confirmada' ? 'selected' : ''}>Confirmada</option>
                            <option value="Cancelada" ${c.estado_cita === 'Cancelada' ? 'selected' : ''}>Cancelada</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn btn-warning btn-sm me-1" onclick="editarCita(${c.id_cita})">✏️ Editar</button>
                                                <button class="btn btn-danger btn-sm" onclick="eliminarCita(${c.id_cita})">🗑️ Eliminar</button>
                    </td>
                </tr>
            `;
        });

    } catch (error) {
        mostrarMensaje("Error al cargar citas: " + error.message, "danger");
    }
}

// 2. ABRIR MODAL Y CÁRGAR DATOS (Soluciona el campo vacío)
async function editarCita(id) {
    try {
        const res = await fetch(`${API_CITAS}/${id}`);
        const c = await res.json();

        if (!res.ok) throw new Error(c.error || "No se pudo obtener la información de la cita.");

        document.getElementById("citaId").value = c.id_cita;

        // Obtención de datos del usuario/comprador
        const correoVal = (c.comprador && (c.comprador.correo || c.comprador.nombre))
                          || c.correo || c.usuario || "";

        const placaVal = (c.vehiculo && c.vehiculo.placa)
                                 || c.placa || "";

        document.getElementById("correo").value = correoVal;
        document.getElementById("placa").value = placaVal;

        if (c.fecha_hora) {
            const dateObj = new Date(c.fecha_hora);
            const pad = num => String(num).padStart(2, '0');
            const fechaIso = `${dateObj.getFullYear()}-${pad(dateObj.getMonth() + 1)}-${pad(dateObj.getDate())}T${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}`;
            document.getElementById("fecha_hora").value = fechaIso;
        }

        document.getElementById("estado_cita").value = c.estado_cita || "Pendiente";
        document.getElementById("modalTitulo").textContent = "Editar Cita #" + c.id_cita;

        // Desplegar modal limpiamente
        const modalEl = document.getElementById("modalCita");
        modalEl.removeAttribute("aria-hidden");

        if (!modalBootstrap) {
            modalBootstrap = new bootstrap.Modal(modalEl, { focus: false });
        }
        modalBootstrap.show();

    } catch (error) {
        mostrarMensaje("Error al abrir la edición: " + error.message, "danger");
            }
}

// 3. GUARDAR CAMBIOS COMPLETOS DESDE EL MODAL
async function guardarCambiosCita(e) {
    e.preventDefault();

    const id = document.getElementById("citaId").value;
    const correo = document.getElementById("correo").value.trim();
    const placa = document.getElementById("placa").value.trim().toUpperCase();
    const fechaInput = document.getElementById("fecha_hora").value;
    const estado_cita = document.getElementById("estado_cita").value;

    if (!correo || !placa || !fechaInput) {
        alert("Por favor complete todos los campos obligatorios.");
        return;
    }

    const fechaFormateada = fechaInput.replace('T', ' ') + (fechaInput.length === 16 ? ':00' : '');

    try {
        const res = await fetch(`${API_CITAS}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                correo: correo,
                                usuario: correo,
                placa: placa,
                fecha_hora: fechaFormateada,
                estado_cita: estado_cita
            })
        });

        const datos = await res.json();

        if (res.ok) {
            mostrarMensaje("Cita actualizada con éxito.", "success");
            if (modalBootstrap) modalBootstrap.hide();
            cargarCitas();
        } else {
            mostrarMensaje(datos.error || "No se pudo actualizar la cita.", "danger");
        }
    } catch (err) {
        mostrarMensaje("Error al conectar con el servidor: " + err.message, "danger");
    }
}

// 4. CAMBIAR ESTADO DIRECTAMENTE DESDE EL SELECT (Fix Error 500)
async function cambiarEstadoDirecto(id, nuevoEstado) {
    try {
        // Primero obtenemos los datos actuales de la cita para no sobrescribir con nulos
        const resInfo = await fetch(`${API_CITAS}/${id}`);
                const c = await resInfo.json();

        if (!resInfo.ok) throw new Error("No se pudo obtener la cita para cambiar el estado.");

        const correoVal = (c.comprador && (c.comprador.correo || c.comprador.nombre)) || c.correo || c.usuario || "";
        const placaVal = (c.vehiculo && c.vehiculo.placa) || c.placa || "";

        let fechaEnvio = c.fecha_hora;
        if (fechaEnvio) {
            fechaEnvio = new Date(fechaEnvio).toISOString().slice(0, 19).replace('T', ' ');
        }

        const res = await fetch(`${API_CITAS}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                correo: correoVal,
                usuario: correoVal,
                placa: placaVal,
                fecha_hora: fechaEnvio,
                estado_cita: nuevoEstado
            })
        });

        if (res.ok) {
            mostrarMensaje(`Estado de la cita #${id} cambiado a '${nuevoEstado}'.`, "success");
                        cargarCitas();
        } else {
            const err = await res.json();
            mostrarMensaje(err.error || "No se pudo cambiar el estado.", "danger");
        }
    } catch (error) {
        mostrarMensaje("Error al actualizar estado: " + error.message, "danger");
    }
}

// 5. ELIMINAR CITA
async function eliminarCita(id) {
    if (!confirm(`¿Estás seguro de que deseas eliminar la cita #${id}?`)) return;

    try {
        const res = await fetch(`${API_CITAS}/${id}`, {
            method: 'DELETE'
        });

        if (res.ok) {
            mostrarMensaje(`Cita #${id} eliminada correctamente.`, "success");
            cargarCitas();
        } else {
            const err = await res.json();
            mostrarMensaje(err.error || "No se pudo eliminar la cita.", "danger");
        }
            } catch (error) {
        mostrarMensaje("Error al eliminar la cita: " + error.message, "danger");
    }
}

// 6. FUNCIÓN AUXILIAR PARA NOTIFICACIONES
function mostrarMensaje(texto, tipo) {
    const msgDiv = document.getElementById("mensajeAlert");
    if (msgDiv) {
        msgDiv.className = `alert alert-${tipo} alert-dismissible fade show my-2`;
        msgDiv.innerHTML = `
            ${texto}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        msgDiv.classList.remove("d-none");
    } else {
        alert(texto);
    }
}
</script>

</body>
</html>
