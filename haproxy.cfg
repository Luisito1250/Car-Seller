global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http_in
    bind *:80
    mode http

    # Dashboard e integración de métricas para monitoreo / JMeter
    stats enable
    stats uri /stats
    stats refresh 5s
    # stats auth admin:admin123  # Descomenta esta línea si quieres ponerle clave

    acl is_caviche path_beg /api/publicaciones
    acl is_sebastian path_beg /api/vehiculos
    acl is_luis path_beg /api/transacciones
    acl is_marco path_beg /api/citas
    acl is_roxsana path_beg /api/usuarios

    use_backend caviche_backend if is_caviche
    use_backend sebastian_backend if is_sebastian
    use_backend luis_backend if is_luis
    use_backend marco_backend if is_marco
    use_backend roxsana_backend if is_roxsana

    default_backend main_frontend

backend publicaciones_backend
    mode http
    balance roundrobin
    server ms-publicaciones ms-publicaciones:3002

backend vehiculos_backend
    mode http
    balance roundrobin
    server ms-vehiculos ms-vehiculos:3005

backend transacciones_backend
    mode http
    balance roundrobin
    server ms-transacciones ms-transacciones:3001

backend citas_backend
    mode http
    balance roundrobin
    server ms-citas ms-citas:3003

backend usuarios_backend
    mode http
    balance roundrobin
    server ms-usuarios ms-usuarios:3004

backend main_frontend
    mode http
    balance roundrobin
    server front-main front-main:80
