<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insertar Vehículo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5 mb-5">
    <h2 class="text-center mb-4">Insertar Nuevo Vehículo</h2>
    <form id="vehiculo-form">
      <div class="mb-3">
        <label for="placa" class="form-label">Placa</label>
        <input type="text" class="form-control" id="placa" placeholder="Ej: ABC123" required />
      </div>
      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo</label>
        <input type="text" class="form-control" id="tipo" placeholder="Ej: Camioneta, Sedán..." required />
      </div>
      <div class="mb-3">
        <label for="marca" class="form-label">Marca</label>
        <input type="text" class="form-control" id="marca" required />
      </div>
      <div class="mb-3">
        <label for="modelo" class="form-label">Modelo</label>
                <input type="text" class="form-control" id="modelo" required />
      </div>
      <div class="mb-3">
        <label for="ano" class="form-label">Año</label>
        <input type="number" class="form-control" id="ano" required />
      </div>
      <div class="mb-3">
        <label for="precio" class="form-label">Precio</label>
        <input type="number" class="form-control" id="precio" required />
      </div>
      <div class="mb-3">
        <label for="kilometraje" class="form-label">Kilometraje</label>
        <input type="number" class="form-control" id="kilometraje" required />
      </div>
      <div class="mb-3">
        <label for="estado" class="form-label">Estado</label>
        <input type="text" class="form-control" id="estado" placeholder="Ej: Disponible, Usado..." required />
      </div>
      <div class="mb-3">
        <label for="imagen" class="form-label">URL de la Imagen del Vehículo</label>
        <input type="url" class="form-control" id="imagen" placeholder="https://ejemplo.com/imagen.jpg" required />
        <img id="preview" src="" alt="Vista previa" class="img-fluid mt-2 d-none rounded shadow-sm" style="max-height:200px;">
      </div>
      <button type="submit" class="btn btn-success">Guardar</button>
      <a href="index.html" class="btn btn-secondary ms-2">Volver</a>
    </form>
        <div id="mensaje" class="alert mt-4 d-none"></div>
  </div>
  <script src="insertar_vehiculo.js"></script>
</body>
</html>
