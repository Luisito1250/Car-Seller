<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Vehículo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width: 650px;">
    <div class="card-body p-4">
      <h2 class="text-center">Editar vehículo</h2>
      <p class="text-center text-muted">Modifica la información de un vehículo.</p>
      <form id="editar-form">
        <div class="mb-3">
          <label for="id" class="form-label">ID del vehículo</label>
          <input type="number" id="id" class="form-control" min="1" required>
        </div>
        <div class="mb-3">
          <label for="tipo" class="form-label">Tipo</label>
          <input type="text" id="tipo" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="marca" class="form-label">Marca</label>
          <input type="text" id="marca" class="form-control" required>
                  </div>
        <div class="mb-3">
          <label for="modelo" class="form-label">Modelo</label>
          <input type="text" id="modelo" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="ano" class="form-label">Año</label>
          <input type="number" id="ano" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="precio" class="form-label">Precio</label>
          <input type="number" id="precio" class="form-control" min="0" required>
        </div>
        <div class="mb-3">
          <label for="kilometraje" class="form-label">Kilometraje</label>
          <input type="number" id="kilometraje" class="form-control" min="0" required>
        </div>
        <div class="mb-3">
          <label for="estado" class="form-label">Estado</label>
          <input type="text" id="estado" class="form-control" required>
        </div>
	<div class="mb-3">
	  <label for="imagen" class="form-label">URL de la Imagen del Vehículo</label>
	  <input type="text" class="form-control" id="imagen" placeholder="https://ejemplo.com/imagen.jpg">
	</div>
        <div class="d-grid">
          <button type="submit" class="btn btn-warning">Guardar cambios</button>
        </div>
      </form>
      <div id="mensaje" class="alert d-none mt-4"></div>
            <div class="text-center mt-3">
        <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
      </div>
    </div>
  </div>
</div>
<script src="editar_vehiculo.js">
document.getElementById('imagen').value = vehiculo.imagen || vehiculo.url_imagen || '';
const vehiculoData = {
    // ... tus otros campos (placa, marca, etc.) ...
    imagen: document.getElementById('imagen').value
};
</script>
</body>
</html>
