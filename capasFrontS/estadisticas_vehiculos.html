<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas del Mercado - Car Seller (Big Data)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>📊 Analítica del Mercado Automotriz (Apache Spark)</h2>
      <a href="index.html" class="btn btn-secondary">Volver al menú</a>
    </div>

    <!-- Tarjetas KPI -->
    <div class="row mb-4 text-center">
      <div class="col-md-4">
        <div class="card shadow-sm p-3">
          <h6 class="text-muted">Vehículos Analizados</h6>
          <h3 id="kpi-total" class="text-primary fw-bold">Cargando...</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm p-3">
          <h6 class="text-muted">Precio Promedio Global</h6>
          <h3 id="kpi-precio" class="text-success fw-bold">Cargando...</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm p-3">
          <h6 class="text-muted">Kilometraje Promedio</h6>
          <h3 id="kpi-km" class="text-warning fw-bold">Cargando...</h3>
        </div>
      </div>
    </div>

    <!-- Gráficas -->
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow-sm p-3">
          <h5 class="card-title">Precio Promedio por Marca ($)</h5>
          <canvas id="graficaMarcas"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm p-3">
          <h5 class="card-title">Tendencia de Precios por Año ($)</h5>
          <canvas id="graficaAnios"></canvas>
        </div>
      </div>
      <div class="col-md-6 mx-auto">
        <div class="card shadow-sm p-3">
          <h5 class="card-title text-center">Distribución por Categoría de Vehícul</h5>
          <canvas id="graficaCombustible"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="estadisticas_vehiculos.js"></script>
</body>
</html>
