<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ver Vehículos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Lista de Vehículos</h2>
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Tipo</th>
          <th>Marca</th>
          <th>Modelo</th>
          <th>Año</th>
          <th>Precio</th>
          <th>Kilometraje</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="vehiculos-table-body"></tbody>
    </table>
    <div class="text-center mt-4">
      <a href="index.html" class="btn btn-secondary">Volver</a>
    </div>
  </div>
  <script>
    fetch('http://192.168.100.3:3005/api/vehiculos')
      .then(response => response.json())
      .then(data => {
        const tableBody = document.getElementById('vehiculos-table-body');
        data.forEach(vehiculo => {
                    const row = document.createElement('tr');
          row.innerHTML = `
            <td>${vehiculo.id_vehiculo}</td>
            <td>${vehiculo.tipo}</td>
            <td>${vehiculo.marca}</td>
            <td>${vehiculo.modelo}</td>
            <td>${vehiculo.ano}</td>
            <td>${vehiculo.precio}</td>
            <td>${vehiculo.kilometraje}</td>
            <td>${vehiculo.estado}</td>
            <td>
              <a href="editar_vehiculo.html?id=${vehiculo.id_vehiculo}" class="btn btn-sm btn-warning">Editar</a>
              <a href="borrar_vehiculo.html?id=${vehiculo.id_vehiculo}" class="btn btn-sm btn-danger">Borrar</a>
            </td>
          `;
          tableBody.appendChild(row);
        });
      })
      .catch(error => {
        console.error('Error:', error);
      });
  </script>
</body>
</html>
