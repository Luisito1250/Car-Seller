<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Vehículo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="card shadow-sm mx-auto" style="max-width: 650px;">
    <div class="card-body p-4">
      <h2 class="text-center">Consultar vehículo</h2>
      <p class="text-center text-muted">Ingresa el ID del vehículo que deseas consultar.</p>
      <form id="consulta-form">
        <div class="mb-3">
          <label for="id" class="form-label">ID del vehículo</label>
          <input type="number" id="id" class="form-control" min="1" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-info">Consultar</button>
        </div>
      </form>
      <div id="resultado" class="mt-4"></div>
      <div class="text-center mt-4">
        <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
              </div>
    </div>
  </div>
</div>
<script src="consultar_vehiculo.js"></script>
</body>
</html>
