<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuncios de Vehículos Publicados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card-img-top { height: 200px; object-fit: cover; background-color: #e9ecef; }
        .no-img-box {
            height: 200px;
            background-color: #e9ecef;
            color: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .badge-placa { font-size: 0.9rem; background-color: #0d6efd; }
        .price { font-size: 1.25rem; font-weight: bold; color: #198754; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <h1 class="mb-0">Anuncios de Vehículos Publicados</h1>
            
            <!-- Grupo de controles: Filtro por placa + Botón Agendar Cita -->
            <div class="d-flex gap-2 flex-grow-1 flex-md-grow-0">
                <div class="input-group">
                    <input type="text" id="inputBuscarPlaca" class="form-control" placeholder="Buscar por placa..." style="max-width: 200px;">
                    <button class="btn btn-outline-primary" type="button" onclick="filtrarPorPlaca()">🔍 Filtrar</button>
                    <button class="btn btn-outline-secondary" type="button" onclick="limpiarFiltro()" title="Limpiar filtro">✖</button>
                </div>
                <a href="../capasFrontM/insertar_producto.html" class="btn btn-primary text-nowrap">📅 Agendar Cita</a>
            </div>
        </div>

        <div id="contenedor" class="row row-cols-1 row-cols-md-3 g-4">Cargando publicaciones...</div>

        <div class="text-center mt-5">
            <a href="index.html" class="btn btn-secondary">&larr; Volver al Portal Principal</a>
        </div>
    </div>

<script>
    let todasLasPublicaciones = [];

    async function cargarPublicaciones() {
        try {
            const res = await fetch('http://192.168.100.3:3002/api/publicaciones');
            if (!res.ok) throw new Error('Error al conectar con la API');

            todasLasPublicaciones = await res.json();
            renderizarPublicaciones(todasLasPublicaciones);

        } catch (err) {
            console.error(err);
            document.getElementById('contenedor').innerHTML = '<div class="col-12"><p class="text-danger text-center">Error al cargar las publicaciones del servidor.</p></div>';
        }
    }

    function renderizarPublicaciones(lista) {
        const contenedor = document.getElementById('contenedor');
        contenedor.innerHTML = '';

        if (!lista || lista.length === 0) {
            contenedor.innerHTML = '<div class="col-12"><p class="text-center text-muted">No se encontraron publicaciones con esa placa.</p></div>';
            return;
        }

        lista.forEach(pub => {
            const tarjeta = document.createElement('div');
            tarjeta.className = 'col';

            const HTMLImagen = (pub.imagen && pub.imagen.trim() !== '')
                ? `<img src="${pub.imagen}" class="card-img-top" alt="Foto Vehículo" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\'no-img-box\'>Sin Imagen</div>';">`
                : `<div class="no-img-box">Sin Imagen</div>`;

            tarjeta.innerHTML = `
                <div class="card h-100 shadow-sm">
                    ${HTMLImagen}
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title m-0">${pub.titulo}</h5>
                            <span class="badge badge-placa text-white">${pub.placa || 'N/A'}</span>
                        </div>
                        <p class="card-text text-muted small">${pub.descripcion || 'Sin descripción'}</p>
                        <div class="price">$${Number(pub.precio_publicacion || pub.precio || 0).toLocaleString()}</div>
                    </div>
                </div>
            `;
            contenedor.appendChild(tarjeta);
        });
    }

    function filtrarPorPlaca() {
        const textoBuscado = document.getElementById('inputBuscarPlaca').value.trim().toUpperCase();

        if (!textoBuscado) {
            renderizarPublicaciones(todasLasPublicaciones);
            return;
        }

        const publicacionesFiltradas = todasLasPublicaciones.filter(pub =>
            pub.placa && pub.placa.toUpperCase().includes(textoBuscado)
        );

        renderizarPublicaciones(publicacionesFiltradas);
    }

    function limpiarFiltro() {
        document.getElementById('inputBuscarPlaca').value = '';
        renderizarPublicaciones(todasLasPublicaciones);
    }

    document.getElementById('inputBuscarPlaca').addEventListener('input', filtrarPorPlaca);

    cargarPublicaciones();
</script>

</body>
</html>
