<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Publicaciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="d-flex justify-content-end mb-2">
    <span id="badgeSesion" class="badge bg-dark fs-6">Sesión: Invitado</span>
  </div>

  <div class="card shadow-sm mb-4 border-0">
    <div class="card-body bg-primary text-white text-center rounded">
      <h2 class="fw-bold mb-1">Módulo de Publicaciones y Anuncios</h2>
      <p class="mb-0 opacity-75">Gestión de anuncios promocionales y catálogo público</p>
    </div>
  </div>

  <div class="d-flex justify-content-center gap-3 mb-5">
    <a href="ver_publicaciones.html" class="btn btn-outline-primary btn-lg shadow-sm">
      Ver Anuncios Publicados
    </a>
    <a id="btnEditarAnuncio" href="crear_publicacion.html" class="btn btn-outline-success btn-lg shadow-sm">
      Editar Anuncio / Buscar Placa
    </a>
  </div>

  <div class="text-center mt-4">
    <button onclick="volverAlPortal()" class="btn btn-secondary btn-sm">
      ← Volver al Portal Principal
    </button>
  </div>
</div>

<script>
const usuario = JSON.parse(localStorage.getItem("usuario"));
const rol = usuario && usuario.rol ? String(usuario.rol).toLowerCase().trim() : "";

const badge = document.getElementById("badgeSesion");
if (usuario) {
    badge.textContent = `Sesión: ${usuario.nombre || usuario.correo} (${rol || "cliente"})`;
}
if (rol === "cliente") {
    document.getElementById("btnEditarAnuncio").classList.add("d-none");
}

function volverAlPortal() {
    if (rol === "admin" || rol === "administrador") {
        window.location.href = "/capasFrontR/admin.html";
    } else if (rol === "vendedor") {
        window.location.href = "/capasFrontR/vendedor.html";
    } else if (rol === "cliente") {
        window.location.href = "/capasFrontR/cliente.html";
    } else {
        window.location.href = "/index.html";
    }
}
</script>

</body>
</html>
