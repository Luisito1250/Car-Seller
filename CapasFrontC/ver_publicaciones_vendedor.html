<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Vehículos - Vendedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card-img-top { height: 200px; object-fit: cover; background-color: #e9ecef; }
        .no-img-box {
            height: 200px;
            background-color: #e9ecef;
            color: #6c757d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .badge-placa { font-size: 0.9rem; background-color: #0d6efd; }
        .price { font-size: 1.25rem; font-weight: bold; color: #198754; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <h1 class="mb-0">Mis Vehículos Publicados</h1>
            
            <!-- Grupo de controles: Filtro por placa + Botón Publicar -->
            <div class="d-flex gap-2 flex-grow-1 flex-md-grow-0">
                <div class="input-group">
                    <input type="text" id="inputBuscarPlaca" class="form-control" placeholder="Buscar por placa..." style="max-width: 200px;">
                    <button class="btn btn-outline-primary" type="button" onclick="filtrarPorPlaca()">🔍 Filtrar</button>
                    <button class="btn btn-outline-secondary" type="button" onclick="limpiarFiltro()" title="Limpiar filtro">✖</button>
                </div>
                <a href="../capasFrontS/insertar_vehiculo.html" class="btn btn-success text-nowrap">➕ Publicar Nuevo Vehículo</a>
            </div>
        </div>

        <div id="contenedor" class="row row-cols-1 row-cols-md-3 g-4">Cargando tus publicaciones...</div>

        <div class="text-center mt-5">
            <a href="../capasFrontR/vendedor.html" class="btn btn-secondary">&larr; Volver al Panel Principal</a>
        </div>
    </div>

    <!-- Modal para Editar Vehículo -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarLabel">Editar Vehículo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditar">
                        <input type="hidden" id="edit-id">
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" id="edit-titulo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Placa</label>
                            <input type="text" id="edit-placa" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Precio</label>
                            <input type="number" id="edit-precio" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">URL Imagen</label>
                            <input type="text" id="edit-imagen" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea id="edit-descripcion" class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validar sesión del vendedor
        const usuario = JSON.parse(localStorage.getItem("usuario"));
        if (!usuario || (usuario.rol && usuario.rol !== 'vendedor')) {
            alert("Acceso denegado. Debe iniciar sesión como vendedor.");
            window.location.href = "/index.html";
        }

        const idVendedorActual = usuario.id || usuario.id_usuario;
        const modalEditar = new bootstrap.Modal(document.getElementById('modalEditar'));
        let listaPublicacionesVendedor = []; // Almacena las publicaciones originales del vendedor

        async function cargarPublicaciones() {
            try {
                const res = await fetch('http://192.168.100.3:3002/api/publicaciones');
                if (!res.ok) throw new Error('Error al conectar con la API');

                const datos = await res.json();
                
                // Filtrar publicaciones pertenecientes ÚNICAMENTE a este vendedor
                listaPublicacionesVendedor = datos.filter(pub => String(pub.id_vendedor || pub.id_usuario) === String(idVendedorActual));

                renderizarPublicaciones(listaPublicacionesVendedor);

            } catch (err) {
                console.error(err);
                document.getElementById('contenedor').innerHTML = '<div class="col-12"><p class="text-danger text-center">Error al cargar tus publicaciones del servidor.</p></div>';
            }
        }

        // Función para renderizar las tarjetas de los vehículos
        function renderizarPublicaciones(lista) {
            const contenedor = document.getElementById('contenedor');
            contenedor.innerHTML = '';

            if (lista.length === 0) {
                contenedor.innerHTML = '<div class="col-12"><p class="text-center text-muted">No se encontraron publicaciones con esa placa.</p></div>';
                return;
            }

            lista.forEach(pub => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'col';

                const HTMLImagen = (pub.imagen && pub.imagen.trim() !== '')
                    ? `<img src="${pub.imagen}" class="card-img-top" alt="Foto Vehículo" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\\'no-img-box\\'>Sin Imagen</div>';">`
                    : `<div class="no-img-box">Sin Imagen</div>`;

                tarjeta.innerHTML = `
                    <div class="card h-100 shadow-sm">
                        ${HTMLImagen}
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="card-title m-0">${pub.titulo}</h5>
                                <span class="badge badge-placa text-white">${pub.placa || 'N/A'}</span>
                            </div>
                            <p class="card-text text-muted small">${pub.descripcion || 'Sin descripción'}</p>
                            <div class="price mb-3">$${Number(pub.precio_publicacion || pub.precio || 0).toLocaleString()}</div>
                            <div class="mt-auto d-flex gap-2">
                                <button class="btn btn-outline-warning btn-sm w-50" onclick='abrirModalEditar(${JSON.stringify(pub)})'>✏️ Editar</button>
                                <button class="btn btn-outline-danger btn-sm w-50" onclick="eliminarPublicacion(${pub.id || pub.id_publicacion})">🗑️ Eliminar</button>
                            </div>
                        </div>
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });
        }

        // Función para filtrar publicaciones por la placa ingresada
        function filtrarPorPlaca() {
            const textoBuscado = document.getElementById('inputBuscarPlaca').value.trim().toUpperCase();
            
            if (!textoBuscado) {
                renderizarPublicaciones(listaPublicacionesVendedor);
                return;
            }

            const publicacionesFiltradas = listaPublicacionesVendedor.filter(pub => 
                pub.placa && pub.placa.toUpperCase().includes(textoBuscado)
            );

            renderizarPublicaciones(publicacionesFiltradas);
        }

        // Función para limpiar la búsqueda y restaurar la lista
        function limpiarFiltro() {
            document.getElementById('inputBuscarPlaca').value = '';
            renderizarPublicaciones(listaPublicacionesVendedor);
        }

        // Búsqueda en tiempo real mientras el usuario escribe
        document.getElementById('inputBuscarPlaca').addEventListener('input', filtrarPorPlaca);

        // Abrir Modal de Edición con datos cargados
        function abrirModalEditar(pub) {
            document.getElementById('edit-id').value = pub.id || pub.id_publicacion;
            document.getElementById('edit-titulo').value = pub.titulo || '';
            document.getElementById('edit-placa').value = pub.placa || '';
            document.getElementById('edit-precio').value = pub.precio_publicacion || pub.precio || 0;
            document.getElementById('edit-imagen').value = pub.imagen || '';
            document.getElementById('edit-descripcion').value = pub.descripcion || '';
            modalEditar.show();
        }

        // Guardar Cambios (PUT)
        document.getElementById('formEditar').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const payload = {
                titulo: document.getElementById('edit-titulo').value,
                placa: document.getElementById('edit-placa').value,
                precio: document.getElementById('edit-precio').value,
                imagen: document.getElementById('edit-imagen').value,
                descripcion: document.getElementById('edit-descripcion').value
            };

            try {
                const res = await fetch(`http://192.168.100.3:3002/api/publicaciones/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('Publicación actualizada con éxito.');
                    modalEditar.hide();
                    cargarPublicaciones();
                } else {
                    alert('Error al actualizar la publicación.');
                }
            } catch (err) {
                console.error(err);
                alert('No se pudo conectar con el servidor.');
            }
        });

        // Eliminar Publicación (DELETE)
        async function eliminarPublicacion(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar este vehículo?')) return;

            try {
                const res = await fetch(`http://192.168.100.3:3002/api/publicaciones/${id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    alert('Vehículo eliminado correctamente.');
                    cargarPublicaciones();
                } else {
                    alert('Error al eliminar el vehículo.');
                }
            } catch (err) {
                console.error(err);
                alert('No se pudo conectar con el servidor.');
            }
        }

        cargarPublicaciones();
    </script>
</body>
</html>
